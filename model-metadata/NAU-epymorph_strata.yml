methods: "An age-stratified stochastic SIRH compartmental model for RSV with six age groups coupled by an empirical contact matrix and a shared time-varying transmission scale, fit to state-level age-specific hospital admissions with an ensemble Kalman filter."
data_inputs: "State-level weekly confirmed RSV hospital admissions from NHSN by age group (0-4, 5-17, 18-49, 50-64, 65-74, 75+), adjusted for the percentage of hospitals reporting. Age-specific contact rates from Mistry et al. (2021), projected onto each state's age distribution. State population by age group from the US Census."
methods_long: "We run a stochastic SIRH (susceptible, infectious, recovered, hospitalized) compartmental model with six age strata, matching the NHSN reporting bands, independently for each state and the District of Columbia using the epymorph simulation framework. Transmission between age groups follows a contact matrix built from the Mistry et al. (2021) synthetic contact data, aggregated to the six bands, projected onto each state's age structure and normalized to unit spectral radius, so that a single transmission scale q(t) shared by all age groups sets the overall level of transmission in each state; q corresponds to the basic reproduction number times the recovery rate. Each age group has its own susceptibility correction and hospitalization probability. Recovery, waning immunity and hospital stay are modeled as constant rates. The transmission scale, the age-specific susceptibility corrections and the age-specific hospitalization probabilities are estimated as unknown parameters that follow Ornstein-Uhlenbeck processes on the log scale, with slow reversion so they remain anchored to prior levels during fitting while the data move them. Each week the model state and unknown parameters are updated with an ensemble Kalman filter (300 realizations) using a negative binomial observation model for the weekly admissions in each age group. During the forecast period the dynamics of every unknown parameter are parameterized by the fitted ensemble. The mean and standard deviation of each parameter's Ornstein-Uhlenbeck process are recomputed each week from the ensemble in each state, with a small floor on the standard deviation, so parameters persist around their most recently estimated levels and the forecast carries the uncertainty of the nowcast forward; only the reversion time scale (28 days) is fixed. Forecasts are produced by simulating the fitted ensemble forward for the target horizons, summing hospital admissions across age groups, and computing quantiles from the realizations; national forecasts are obtained by summing state realizations before taking quantiles. The ensemble is initialized each season by drawing initial infected and recovered fractions for each age group and state, after which assimilation begins."
