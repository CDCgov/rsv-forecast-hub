methods: "EpiRSI: an LLM agent writes data skills for frozen time-series foundation models and boosted trees, verified on past seasons; fixed greedy ensemble selection of the experts, no LLM at forecast time."
data_inputs: "NHSN weekly RSV admissions (hub target data as available at the deadline); NSSP percent of emergency-department visits with RSV, ILINet and clinical laboratory data (Delphi Epidata / CDC, versions as of the deadline); RSV-NET hospitalisation rates (completed weeks up to two weeks before the deadline); US holiday calendar."
methods_long: "Experts run every week on the data available at the deadline: Chronos-2, TimesFM-3 and Toto-2 whose inputs are built by an agent-written skill (histories shorter than three years back-extended from RSV-specific proxies with correlation-weighted donor jurisdictions and cross-jurisdiction scale priors, pooled robust scaling), pooled LightGBM quantile regression on lagged features (also with a joint series and with ILINet, NSSP, clinical and calendar covariates), and two simple mechanistic models. Skills were proposed by an LLM agent (Gemini 3.1 Pro) and accepted only if they improved the score in at least two thirds of 7 past seasons rebuilt with the data as of each deadline (NHSN 2024-25, RSV-NET 2018-2024, NSSP 2022-2024). The forecast is a fixed weighted average of the experts in log space: members and weights were chosen once by greedy forward ensemble selection with replacement (Caruana et al. 2004) on the same 7 past seasons - Chronos-2 with the skill inputs 0.4, LightGBM with the joint series 0.2, plain LightGBM 0.1, the SIR model 0.1, Toto-2 with the skill inputs 0.1, the log-space mean of the three foundation models 0.1 - and do not change during the season. Code frozen for the season; no manual adjustment; the LLM is not called at forecast time."
