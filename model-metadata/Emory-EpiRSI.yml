methods: "EpiRSI: an LLM agent writes data skills for frozen time-series foundation models and boosted trees, verified on past seasons; fixed greedy ensemble selection of the experts, no LLM at forecast time."
data_inputs: "NHSN weekly RSV admissions (hub target data as available at the deadline); NSSP percent of emergency-department visits with RSV, ILINet and clinical laboratory data (Delphi Epidata / CDC, versions as of the deadline); RSV-NET hospitalisation rates (completed weeks up to two weeks before the deadline); US holiday calendar."
methods_long: "Experts run every week on the data available at the deadline: Chronos-2, TimesFM-3 and Toto-2 whose inputs are built by an agent-written skill composed from ten earlier accepted skills (histories back-extended from RSV-specific proxies with cross-jurisdiction scale priors, continuity smoothing at the extension boundary, handling of incomplete newest weeks, momentum and national and regional phase covariates, robust per-capita scaling), pooled LightGBM quantile regression on lagged features (also with a joint series and with ILINet, NSSP, clinical and calendar covariates), a LightGBM quantile regression whose training table is built by an agent-written skill (developed from the skill of the previous version, which back-casts short histories from scale-matched syndromic signals; newest weeks cleaned of holiday dips; the reporting revision estimated at the deadline as a covariate, so that the trees separate incomplete newest weeks from final values; a newest-week reporting-shock detector using peer jurisdictions and the week-to-week changes of NSSP and RSV-NET; partly computed with a tool library the agent wrote in earlier search rounds), and two simple mechanistic models. Skills were proposed by an LLM agent (Gemini 3.1 Pro) and accepted only if they improved the score in at least two thirds of 7 past seasons rebuilt with the data as of each deadline (NHSN 2024-25, RSV-NET 2018-2024, NSSP 2022-2024); the LightGBM skill of model_version v15g26 was proposed by Gemini 4 Carbon (with dates and years removed from its prompts) in a search whose acceptance test also included NHSN 2025-26, and replaced the earlier one after a pre-registered test on 8 past seasons (the 7 above and NHSN 2025-26). The forecast is a fixed weighted average of the experts in log space: members and weights were chosen once by greedy forward ensemble selection with replacement (Caruana et al. 2004) on the same 8 past seasons - the skill-built LightGBM 0.6, Chronos-2 with the skill inputs 0.2, the SIR model 0.1, the log-space average of the three foundation models with the skill inputs 0.1. During the season the members change only when a new expert passes the same multi-season test and the change is pre-registered before its first use (model_version names the deployed version; v15g26 replaced the skill-built LightGBM and added 2025-26 to the selection seasons); no manual adjustment; the LLM is not called at forecast time."
