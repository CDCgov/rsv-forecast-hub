data_inputs: "Weekly RSV hospital admissions from NHSN and the percent of emergency department visits due to RSV from NSSP, including their revision histories, queried through the Delphi Epidata API."
methods: "An equal-weight ensemble of three quantile autoregressions: a seasonally windowed AR, an AR with NSSP ED visits as a predictor, and a revision-aware AR."
methods_long: "An equal-weight ensemble of three quantile autoregression models.
Each model is fit jointly across all states, DC, Puerto Rico and the US as a whole, with a separate quantile regression for each of the 23 quantiles and quantile sorting applied post hoc.
In all three, each signal is centered, scaled by its quantiles and fourth-root transformed per location.
The first model uses lags of 0 to 3 weeks of RSV hospital admissions, and trains only on weeks within 5 weeks before and 3 weeks after the current week of the season, in every past season.
The second model uses lags of 0 to 3 weeks of RSV hospital admissions and lags of 0 to 2 weeks of the NSSP percent of ED visits due to RSV.
The third model trains on past versions of the data, so that it learns how the most recent weeks are revised; it uses lags of 0 and 1 weeks, trains on the same seasonal window, and is the only component at horizon -1.
Where no component makes a forecast, a small weight on a climatological and linear trend baseline fills in.
For the ED visits target, the same models run with the roles of the two signals swapped.
All data signals are available as indicators through the Delphi Epidata API (https://cmu-delphi.github.io/delphi-epidata)."
