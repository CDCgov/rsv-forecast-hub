data_inputs: "NHSN weekly confirmed RSV hospital admissions (RSV Forecast Hub target data from November 2024, vintage available at the forecast deadline)."
methods: "Per-location equal-weight linear pool of the 5 insight.cast candidate models with the lowest cross-validated WIS over 5 origins around the same week last season."
methods_long: "Forecasts are produced with the insight.cast R package. For each location, candidate models (random walk, ETS, theta, ARIMA variants, NNETAR, endemic-epidemic HHH4 models and pretrained time-series foundation models (Chronos, TimesFM, Sundial)) are cross-validated at 5 origins: the reference date shifted back 52 weeks, plus the two weeks before and after, scoring 4-week-ahead forecasts by weighted interval score. Only data from November 2024, when NHSN RSV reporting became mandatory, are used. The five lowest-WIS candidates are refit on the latest data and combined with an equal-weight linear pool."
ensemble_of_models: true
ensemble_of_hub_models: false
designated_targets: ["wk inc rsv hosp"]
