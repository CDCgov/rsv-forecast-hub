name: Hub Submission Validation (R)

on:
  workflow_dispatch:
  pull_request:
    branches: main
    paths:
      - 'model-output/**'
      - 'model-metadata/*'
      - '!**README**'

permissions:
  contents: read
  pull-requests: read

jobs:
  validate-submission:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v7

      - name: "Get Model Output Changes"
        id: get_changed_files_in_model_output
        uses: step-security/changed-files@v47
        with:
          path: model-output
          dir_names: "true"

      - uses: hubverse-org/hubverse-actions/validate-submission@main
        with:
          skip_submit_window_check: ${{ steps.get_changed_files_in_model_output.outputs.all_modified_files == 'RSVHub-ensemble' }}
